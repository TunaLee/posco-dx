# 회귀 평가 CI 예시 (GitHub Actions)
# 쓰는 법: 이 파일을 저장소의 .github/workflows/eval.yml 로 복사하고,
#          저장소 Settings → Secrets 에 ANTHROPIC_API_KEY 를 넣는다.
# 수동 실행(workflow_dispatch)만 켜 두었다 — 실행할 때마다 API 비용이 든다.
# 기준 결과(baseline)는 미리 한 번 돌려서 lab5_regression/results/baseline_<track>.json 으로 커밋해 둔다.
name: agent-eval

on:
  workflow_dispatch:
    inputs:
      track:
        description: "pangyo | pohang"
        default: "pangyo"
      cases:
        description: "평가할 건수 (0 = 전부)"
        default: "10"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: labs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 평가 스위트 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: >
          python lab5_regression/run_suite.py
          --track ${{ inputs.track }} -n ${{ inputs.cases }} --k 2
          --out lab5_regression/results/ci_${{ inputs.track }}.json
      - name: 기준 결과와 비교 (회귀면 실패)
        run: >
          python lab5_regression/compare.py
          lab5_regression/results/baseline_${{ inputs.track }}.json
          lab5_regression/results/ci_${{ inputs.track }}.json
      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ inputs.track }}
          path: labs/lab5_regression/results/ci_*
