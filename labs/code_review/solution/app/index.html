<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>리뷰 콘솔</title>
<style>
  :root{--ink:#16233A; --navy:#1F3A5F; --line:#E1E5EB; --orange:#F28C28; --bg:#F6F8FA;}
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:var(--ink); background:var(--bg); height:100vh; display:flex; flex-direction:column;}
  header{display:flex; align-items:center; gap:16px; padding:14px 24px; background:var(--navy); color:#fff;}
  header b{font-size:19px;} header span{font-size:13px; opacity:.75;}
  nav{display:flex; gap:4px; padding:10px 24px 0; background:#fff; border-bottom:1px solid var(--line); overflow-x:auto;}
  nav button{border:0; background:none; font:inherit; font-size:15px; font-weight:700; color:#6B7785; padding:10px 16px; border-bottom:3px solid transparent; cursor:pointer; white-space:nowrap;}
  nav button.on{color:var(--navy); border-bottom-color:var(--navy);}
  nav button.new::after{content:"NEW"; margin-left:6px; font-size:10px; color:#fff; background:var(--orange); border-radius:4px; padding:1px 5px; vertical-align:2px;}
  nav button.new{animation:pop .6s ease-out;}
  @keyframes pop{from{transform:scale(.6); opacity:0}}
  iframe{flex:1; border:0; width:100%; background:#fff;}
</style>
</head>
<body>
<header><b>리뷰 콘솔</b><span>팀 코드 저장소 · 실습용 가상 자료 · 탭 = app/tabs/ 파일</span></header>
<nav id="nav"></nav>
<iframe id="view"></iframe>
<script>
let known = null, cur = null;
const nav = document.getElementById("nav"), view = document.getElementById("view");
function open(file) {
  cur = file; view.src = "/tabs/" + encodeURIComponent(file);
  for (const b of nav.children) b.classList.toggle("on", b.dataset.f === file);
  localStorage.setItem("tab", file);
}
async function load() {
  const list = await (await fetch("/tabs.json")).json();
  const names = list.map(t => t.file);
  const fresh = known ? names.filter(n => !known.includes(n)) : [];
  if (known && fresh.length === 0 && names.length === known.length) return;
  nav.innerHTML = "";
  for (const t of list) {
    const b = document.createElement("button");
    b.textContent = t.title; b.dataset.f = t.file;
    if (fresh.includes(t.file)) b.classList.add("new");
    b.onclick = () => open(t.file);
    nav.appendChild(b);
  }
  known = names;
  const want = fresh[0] || (names.includes(cur) ? cur : (names.includes(localStorage.getItem("tab")) ? localStorage.getItem("tab") : names[0]));
  if (want && want !== cur) open(want); else if (cur) open(cur);
}
load(); setInterval(load, 3000);
</script>
</body>
</html>
