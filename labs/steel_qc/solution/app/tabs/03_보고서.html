<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보고서</title>
<style>
  body{margin:0; padding:20px 24px; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#16233A;}
  .top{display:flex; align-items:baseline; gap:12px; margin-bottom:12px;} .top b{font-size:22px;} .top span{color:#6B7785; font-size:13px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{background:#F4F6F9; text-align:left; padding:8px 10px; color:#6B7785; font-weight:700;}
  td{padding:7px 10px; border-bottom:1px solid #EEF1F5; font-variant-numeric:tabular-nums; vertical-align:top;}
  .bad td{background:#FDECEC;} .near td{background:#FFF8F1;} .tag{display:inline-block; border-radius:6px; padding:1px 8px; font-weight:800; color:#fff; font-size:12px;}
  .r{background:#C62828;} .o{background:#EF6C00;} .g{background:#2E7D32;}
  .bar{height:10px; background:#F28C28; border-radius:5px;}
  .cols{display:grid; grid-template-columns:260px 1fr; gap:18px;} .list div{padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px;} .list div.on{background:#EEF1F5; font-weight:800;}
  pre{white-space:pre-wrap; font-family:inherit; font-size:14px; line-height:1.6; background:#F8F9FB; border-radius:10px; padding:16px 20px; margin:0;}
  .big{font-size:44px; font-weight:900;} .empty{color:#8A94A3; padding:30px 0;}
</style>
</head>
<body>
<div class="top"><b id="n">-</b><span>Skill이 쓴 보고서 · 조사 Agent 결과 · out/보고서 · out/조사</span></div>
<div class="cols"><div class="list" id="list"></div><pre id="doc" class="empty">아직 없음</pre></div>
<script>
const DIRS = ["out/보고서", "out/조사"];
let cur = null;
async function tick() {
  let items = [];
  for (const d of DIRS) {
    const r = await fetch("/files/" + d + "/"); if (!r.ok) continue;
    for (const x of await r.json()) if (!x.dir) items.push({path: d + "/" + x.name, name: x.name, dir: d, mtime: x.mtime});
  }
  items.sort((a, b) => b.mtime - a.mtime);
  document.getElementById("n").textContent = items.length + "건";
  document.getElementById("list").innerHTML = items.map(x => `<div data-p="${x.path}" class="${x.path === cur ? "on" : ""}">${x.dir.split("/").pop()} · ${x.name}</div>`).join("");
  for (const el of document.querySelectorAll("#list div")) el.onclick = () => show(el.dataset.p);
  if (!cur && items.length) show(items[0].path);
}
async function show(p) {
  cur = p; const t = await (await fetch("/files/" + p)).text();
  const doc = document.getElementById("doc"); doc.textContent = t; doc.className = "";
  for (const el of document.querySelectorAll("#list div")) el.classList.toggle("on", el.dataset.p === p);
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
