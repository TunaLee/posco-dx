<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시험 결과</title>
<style>
  body{margin:0; padding:20px 24px; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#16233A;}
  .top{display:flex; align-items:baseline; gap:12px; margin-bottom:12px;} .top b{font-size:22px;} .top span{color:#6B7785; font-size:13px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{background:#F4F6F9; text-align:left; padding:8px 10px; color:#6B7785; font-weight:700;}
  td{padding:7px 10px; border-bottom:1px solid #EEF1F5; font-variant-numeric:tabular-nums;}
  tr.fresh td{background:#FFF8F1;}
</style>
</head>
<body>
<div class="top"><b id="n">-</b><span>누적 코일 · 최근 30건 · 판정 없이 원본 값 · 3초마다 갱신</span></div>
<table><thead><tr><th>코일</th><th>강종</th><th>라인</th><th>교대</th><th>시각</th><th>C</th><th>Mn</th><th>P</th><th>S</th><th>YS</th><th>TS</th><th>EL</th></tr></thead>
<tbody id="rows"></tbody></table>
<script>
let last = 0;
async function tick() {
  const rows = await (await fetch("/sim/results?since=0&limit=100000")).json();
  if (!Array.isArray(rows)) return;
  document.getElementById("n").textContent = rows.length.toLocaleString() + "건";
  const top = rows.slice(-30).reverse(), K = ["C", "Mn", "P", "S", "YS", "TS", "EL"];
  document.getElementById("rows").innerHTML = top.map(r =>
    `<tr class="${r.seq > last && last ? "fresh" : ""}"><td>${r.coil_id}</td><td>${r.grade}</td><td>${r.line}</td><td>${r.shift}</td><td>${r.time}</td>` +
    K.map(k => `<td>${r.values[k]}</td>`).join("") + "</tr>").join("");
  last = rows.length ? rows[rows.length - 1].seq : 0;
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
