<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>실시간 판정</title>
<style>
  body{margin:0; padding:20px 24px; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#16233A;}
  .top{display:flex; align-items:baseline; gap:12px; margin-bottom:12px;} .top b{font-size:22px;} .top span{color:#6B7785; font-size:13px;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{background:#F4F6F9; text-align:left; padding:8px 10px; color:#6B7785; font-weight:700;}
  td{padding:7px 10px; border-bottom:1px solid #EEF1F5; font-variant-numeric:tabular-nums; vertical-align:top;}
  .bad td{background:#FDECEC;} .near td{background:#FFF8F1;} .tag{display:inline-block; border-radius:6px; padding:1px 8px; font-weight:800; color:#fff; font-size:12px;}
  .r{background:#C62828;} .o{background:#EF6C00;} .g{background:#2E7D32;}
  .bar{height:10px; background:#F28C28; border-radius:5px;}
  .cols{display:grid; grid-template-columns:260px 1fr; gap:18px;} .list div{padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px;} .list div.on{background:#EEF1F5; font-weight:800;}
  pre{white-space:pre-wrap; font-family:inherit; font-size:14px; line-height:1.6; background:#F8F9FB; border-radius:10px; padding:16px 20px; margin:0;}
  .big{font-size:44px; font-weight:900;} .empty{color:#8A94A3; padding:30px 0;}
</style>
</head>
<body>
<div style="display:flex;gap:14px;margin-bottom:14px" id="cards"></div>
<table><thead><tr><th>판정</th><th>코일</th><th>강종</th><th>라인</th><th>시각</th><th>항목 (값 / 규격)</th></tr></thead><tbody id="rows"></tbody></table>
<script>
let specs = null;
function judge(r) {
  const g = specs.grades[r.grade].limits, k = specs.near_ratio, out = [], near = [];
  for (const [it, [lo, hi]] of Object.entries(g)) {
    const v = r.values[it], lim = `${it} ${v} / ${lo ?? ""}~${hi ?? ""}`;
    if ((lo !== null && v < lo) || (hi !== null && v > hi)) out.push(lim);
    else if ((hi !== null && v >= hi * (1 - k)) || (lo !== null && v <= lo * (1 + k))) near.push(lim);
  }
  return {v: out.length ? "불합격" : near.length ? "근접" : "합격", items: out.length ? out : near};
}
async function tick() {
  specs = specs || await (await fetch("/sim/specs")).json();
  const rows = (await (await fetch("/sim/results?since=0&limit=100000")).json()).map(r => ({...r, j: judge(r)}));
  const c = {불합격: 0, 근접: 0, 합격: 0}; rows.forEach(r => c[r.j.v]++);
  document.getElementById("cards").innerHTML = [["누적", rows.length, "#16233A"], ["불합격", c.불합격, "#C62828"], ["근접", c.근접, "#EF6C00"], ["합격", c.합격, "#2E7D32"]]
    .map(([k, v, col]) => `<div style="flex:1;border:1.5px solid #E1E5EB;border-radius:12px;padding:12px 18px"><div class="big" style="color:${col}">${v}</div>${k}</div>`).join("");
  const order = {불합격: 0, 근접: 1, 합격: 2};
  const show = rows.slice().reverse().sort((a, b) => order[a.j.v] - order[b.j.v]).slice(0, 40);
  document.getElementById("rows").innerHTML = show.map(r => `<tr class="${r.j.v === "불합격" ? "bad" : r.j.v === "근접" ? "near" : ""}">` +
    `<td><span class="tag ${r.j.v === "불합격" ? "r" : r.j.v === "근접" ? "o" : "g"}">${r.j.v}</span></td><td>${r.coil_id}</td><td>${r.grade}</td><td>${r.line}</td><td>${r.time}</td><td>${r.j.items.join(" · ")}</td></tr>`).join("");
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
