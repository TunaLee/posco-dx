<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{DECK_TITLE}}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#16142B; --ink-soft:#4A4766; --mut:#8E8AAC;
    --violet:#5B3DF5; --violet-700:#3A1FC9; --violet-300:#B7A9FF;
    --wash:#F4F1FF; --wash-2:#FAF9FF; --line:#E8E4F8;
    --paper:#FFFFFF; --mint:#0FB5A1; --mint-soft:#E4F8F4;
    --amber:#F4A93C; --rose:#E8537A;
    --code-bg:#1C1933; --code-ink:#ECEAFF; --code-dim:#9C97D6;
    --sw:1280px; --sh:720px;
    --shadow:0 24px 60px -24px rgba(43,28,120,.45);
    --serif: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--serif); color:var(--ink);
    background:
      radial-gradient(1200px 600px at 15% -10%, #ECE7FF 0%, rgba(236,231,255,0) 60%),
      radial-gradient(1000px 700px at 110% 10%, #F0EBFF 0%, rgba(240,235,255,0) 55%),
      #EAE7F4;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .progress{position:fixed; top:0; left:0; right:0; height:3px; z-index:60; background:transparent;}
  .progress .fill{height:100%; width:0; background:linear-gradient(90deg,var(--violet),#9B7BFF); transition:width .2s ease;}

  .stage{
    position:fixed; inset:0 0 0 0; z-index:10;
    display:flex; justify-content:safe center; align-items:safe center;
    overflow:auto; padding:30px 30px 96px;
  }
  .sizer{position:relative;}
  .scaler{ width:var(--sw); height:var(--sh); transform-origin:top left; position:relative; }

  .slide{
    width:var(--sw); height:var(--sh);
    background:var(--paper); border:1px solid var(--line);
    border-radius:22px; box-shadow:var(--shadow);
    overflow:hidden; display:none; flex-direction:column;
    padding:50px 60px 46px; position:relative;
  }
  .slide.active{display:flex;}

  .eyebrow{display:inline-flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; font-weight:700; letter-spacing:.04em; color:var(--violet); text-transform:uppercase;}
  .eyebrow .tag{color:#fff; background:var(--violet); border-radius:6px; padding:3px 8px; font-size:11px; letter-spacing:.05em;}
  .eyebrow .tag.mint{background:var(--mint);}
  .eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--violet-300);}
  .coord{position:absolute; top:30px; right:40px; font-family:var(--mono); font-size:12px; color:var(--mut); font-weight:600; letter-spacing:.05em;}
  .coord b{color:var(--ink);}

  .s-title{font-size:39px; line-height:1.12; letter-spacing:-.025em; font-weight:800; margin:14px 0 4px;}
  .s-title.sm{font-size:32px;} .s-title.xs{font-size:28px;}
  .s-sub{font-size:17px; color:var(--ink-soft); font-weight:500; line-height:1.5; max-width:64ch;}
  .rule{height:4px; width:54px; border-radius:3px; background:var(--violet); margin:13px 0 6px;}
  .body{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center;}
  .body.top{justify-content:flex-start; padding-top:6px;}

  .slide.cover{ padding:0; justify-content:center;
    background:
      radial-gradient(900px 520px at 100% 0%, #6B4BFF 0%, rgba(107,75,255,0) 58%),
      radial-gradient(700px 600px at -5% 110%, #3A1FC9 0%, rgba(58,31,201,0) 55%),
      linear-gradient(135deg,#2A1B8C 0%, #4226D6 48%, #5B3DF5 100%);
    color:#fff; border:none; }
  .cover .aperture{position:absolute; top:-120px; right:-120px; width:460px; height:460px; border-radius:50%; background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.5), rgba(255,255,255,0) 62%); filter:blur(2px);}
  .cover .ring{position:absolute; right:60px; top:60px; width:120px; height:120px; border-radius:50%; border:1.5px solid rgba(255,255,255,.4);}
  .cover .ring::after{content:""; position:absolute; inset:18px; border-radius:50%; border:1.5px dashed rgba(255,255,255,.35);}
  .cover .wrap{padding:60px 70px; position:relative; z-index:2; width:100%;}
  .cover .kick{font-family:var(--mono); letter-spacing:.18em; font-size:13.5px; font-weight:600; color:rgba(255,255,255,.86); text-transform:uppercase; display:flex; align-items:center; gap:14px;}
  .cover .kick .pill{border:1px solid rgba(255,255,255,.45); border-radius:999px; padding:4px 12px;}
  .cover h1{font-size:58px; line-height:1.08; letter-spacing:-.03em; font-weight:800; margin:24px 0 16px; max-width:21ch;}
  .cover .lead{font-size:18px; line-height:1.55; color:rgba(255,255,255,.9); max-width:56ch; font-weight:400;}
  .cover .meta{margin-top:36px; display:flex; gap:24px; flex-wrap:wrap; font-size:14px;}
  .cover .meta .it{display:flex; flex-direction:column; gap:3px;}
  .cover .meta .it .k{font-family:var(--mono); font-size:11px; letter-spacing:.1em; color:rgba(255,255,255,.6); text-transform:uppercase;}
  .cover .meta .it .v{font-size:15px; font-weight:700; color:#fff;}

  .slide.section{ background:linear-gradient(140deg,#3A1FC9 0%, #5B3DF5 70%, #7A5BFF 100%); color:#fff; border:none; justify-content:center; padding:60px 70px; }
  .slide.section.mintbg{ background:linear-gradient(140deg,#0A8A7A 0%, #0FB5A1 70%, #34D6C2 100%); }
  .slide.section .ghost{position:absolute; right:34px; bottom:-66px; font-family:var(--mono); font-weight:700; font-size:330px; line-height:.8; color:rgba(255,255,255,.10); letter-spacing:-.04em;}
  .slide.section .lab-flag{display:inline-flex; align-items:center; gap:9px; align-self:flex-start; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.4); padding:7px 14px; border-radius:999px; font-weight:700; font-size:13px; font-family:var(--mono); letter-spacing:.06em;}
  .slide.section .lab-flag .sq{width:9px;height:9px;border-radius:3px;background:#fff;}
  .slide.section .seyebrow{font-family:var(--mono); letter-spacing:.16em; font-size:14px; color:rgba(255,255,255,.85); text-transform:uppercase; margin-bottom:14px;}
  .slide.section h2{font-size:48px; line-height:1.1; letter-spacing:-.025em; font-weight:800; margin:0 0 14px; max-width:24ch; position:relative; z-index:2;}
  .slide.section p{font-size:18px; color:rgba(255,255,255,.92); max-width:54ch; line-height:1.55; position:relative; z-index:2;}
  .slide.section .agenda{display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; position:relative; z-index:2;}
  .slide.section .agenda span{font-size:13px; font-weight:600; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); padding:6px 12px; border-radius:999px;}

  .cards{display:grid; gap:16px;}
  .cards.c2{grid-template-columns:repeat(2,1fr);} .cards.c3{grid-template-columns:repeat(3,1fr);} .cards.c4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--violet); border-radius:4px; padding:17px 19px; display:flex; flex-direction:column; gap:7px; position:relative;}
  .card .ic{width:38px; height:38px; border-radius:4px; display:grid; place-items:center; background:transparent; border:1.5px solid var(--violet-300); color:var(--violet); margin-bottom:3px;}
  .card .ic svg{width:20px;height:20px;}
  .card h3{font-size:17px; font-weight:800; letter-spacing:-.01em; margin:0 0 1px; padding-bottom:8px; border-bottom:1px solid var(--line);}
  .card p{font-size:14px; color:var(--ink-soft); line-height:1.5; margin:0;}
  .card .n{font-family:var(--mono); font-size:11.5px; color:var(--violet); font-weight:700;}

  .biglist{display:flex; flex-direction:column; gap:13px;}
  .biglist .li{display:flex; gap:15px; align-items:flex-start;}
  .biglist .li .num{flex:none; width:34px; height:34px; border-radius:10px; background:var(--violet); color:#fff; font-family:var(--mono); font-weight:700; display:grid; place-items:center; font-size:14px; margin-top:1px;}
  .biglist .li .tx h4{margin:0 0 3px; font-size:17.5px; font-weight:800;}
  .biglist .li .tx p{margin:0; font-size:14px; color:var(--ink-soft); line-height:1.5;}

  .phase-label{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.08em; color:var(--violet); text-transform:uppercase; margin:0 0 10px; display:flex; align-items:center; gap:9px;}
  .phase-label .ln{height:1px; flex:1; background:var(--line);}
  .pipe{display:flex; align-items:stretch; gap:0; margin-bottom:20px;}
  .pipe .step{flex:1; background:var(--paper); border:1px solid var(--line); border-top:3px solid var(--violet); border-radius:4px; padding:12px 10px; text-align:center; min-width:0;}
  .pipe .step .si{font-family:var(--mono); font-size:11px; color:var(--violet); font-weight:700;}
  .pipe .step .sn{font-size:14.5px; font-weight:800; margin-top:3px; letter-spacing:-.01em;}
  .pipe .step .sd{font-size:11px; color:var(--mut); margin-top:2px; line-height:1.3;}
  .pipe .arrow{display:flex; align-items:center; padding:0 5px; color:var(--violet-300);}
  .pipe .arrow svg{width:17px;height:17px;}
  .pipe.q .step{background:var(--paper); border-color:var(--line); border-top-color:var(--mint);} .pipe.q .step .si{color:var(--mint);} .pipe.q .arrow{color:#8AD7CC;}

  .code{background:var(--code-bg); border-radius:14px; overflow:hidden; border:1px solid #2A2548; box-shadow:0 18px 40px -22px rgba(28,25,51,.7);}
  .code .bar{display:flex; align-items:center; gap:7px; padding:10px 15px; border-bottom:1px solid #2A2548; background:#171430;}
  .code .bar .dot{width:11px;height:11px;border-radius:50%;}
  .code .bar .r{background:#FF6058;} .code .bar .y{background:#FFC130;} .code .bar .g{background:#28CA42;}
  .code .bar .copybtn{margin-left:auto; font:600 12px var(--sans, sans-serif); color:#fff; background:#F28C28; border:0; border-radius:6px; padding:4px 10px; cursor:pointer;}
  .code .bar .copybtn.done{background:#28CA42;}
  .code .bar .savebtn{margin-left:6px; font:600 12px var(--sans, sans-serif); color:#1F3A5F; background:#fff; border:0; border-radius:6px; padding:4px 10px; cursor:pointer;}
  @media print{.code .bar .savebtn{display:none}}
  @media print{.code .bar .copybtn{display:none}}
  .code .bar .copybtn, .code .bar .savebtn{flex:none; white-space:nowrap;}
  .code .bar .fn{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-left:8px; font-family:var(--mono); font-size:12px; color:var(--code-dim);}
  .code pre{margin:0; padding:16px 18px; overflow:auto;}
  .code code{font-family:var(--mono); font-size:13px; line-height:1.6; color:var(--code-ink); white-space:pre;}
  .code.sm code{font-size:12px; line-height:1.55;}
  .cm{color:#7D78B8;} .kw{color:#C792FF;} .st{color:#9DE39A;} .fn2{color:#82D3FF;} .nm{color:#FFD479;}

  .callout{border-radius:4px; padding:15px 18px; display:flex; gap:13px; align-items:flex-start; background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--violet);}
  .callout .ci{flex:none; width:34px;height:34px;border-radius:4px;background:var(--violet);color:#fff;display:grid;place-items:center;}
  .callout .ci svg{width:18px;height:18px;}
  .callout .ct h4{margin:0 0 3px; font-size:15.5px; font-weight:800;}
  .callout .ct p{margin:0; font-size:13.5px; color:var(--ink-soft); line-height:1.5;}
  .callout.mint{border-left-color:var(--mint);} .callout.mint .ci{background:var(--mint);}
  .callout.amber{border-left-color:var(--amber);} .callout.amber .ci{background:var(--amber);}
  .callout.rose{border-left-color:var(--rose);} .callout.rose .ci{background:var(--rose);}

  .lab-badge{display:inline-flex; align-items:center; gap:9px; background:var(--mint-soft); color:#0A7F70; border:1px solid #BFE9E1; padding:7px 13px; border-radius:999px; font-weight:700; font-size:13px; font-family:var(--mono); letter-spacing:.04em;}
  .lab-badge .sq{width:9px;height:9px;border-radius:3px;background:var(--mint);}

  .twocol{display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start;}
  .twocol.w{grid-template-columns:1.15fr .85fr;} .twocol.w2{grid-template-columns:.85fr 1.15fr;}

  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{font-size:12.5px; font-weight:600; color:var(--ink-soft); background:#fff; border:1px solid var(--line); padding:6px 12px; border-radius:999px;}
  .chip b{color:var(--violet);}

  .deliv{background:var(--paper); border:1px dashed var(--violet-300); border-left:3px solid var(--violet); border-radius:4px; padding:15px 18px; display:flex; align-items:center; gap:13px;}
  .deliv .di{flex:none;width:36px;height:36px;border-radius:4px;background:var(--violet);color:#fff;display:grid;place-items:center;}
  .deliv .di svg{width:19px;height:19px;}
  .deliv .dt b{display:block;font-size:11px;font-family:var(--mono);letter-spacing:.08em;color:var(--violet);text-transform:uppercase;}
  .deliv .dt span{font-size:15px;font-weight:700;}

  .vlist{display:flex;flex-direction:column;gap:10px;}
  .vlist .v{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:var(--ink-soft);line-height:1.45;}
  .vlist .v .b{flex:none;width:22px;height:22px;border-radius:7px;background:var(--wash);color:var(--violet);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;margin-top:1px;}
  .vlist .v b{color:var(--ink);font-weight:700;}

  .keymsg{margin-top:auto; background:var(--ink); color:#fff; border-radius:4px; padding:15px 20px; display:flex; gap:13px; align-items:center; font-size:15px; line-height:1.5;}
  .keymsg .k{font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--violet-300);text-transform:uppercase;flex:none;}
  .keymsg b{color:#fff;}

  .formula{display:flex; flex-direction:column; gap:10px; background:var(--code-bg); border-radius:13px; padding:20px; color:#fff; font-family:var(--mono);}
  .formula .big{font-size:21px; text-align:center;}

  .ctable{width:100%; border-collapse:separate; border-spacing:0; font-size:14px; border:1px solid var(--line); border-radius:13px; overflow:hidden;}
  .ctable th,.ctable td{padding:13px 16px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  .ctable thead th{background:var(--wash); color:var(--violet); font-family:var(--mono); font-size:12px; letter-spacing:.04em; text-transform:uppercase; font-weight:700;}
  .ctable tbody tr:last-child td{border-bottom:none;}
  .ctable td b{color:var(--ink);} .ctable .hl{color:var(--violet); font-weight:700;}
  .ctable .yes{color:var(--mint); font-weight:700;} .ctable .no{color:var(--rose); font-weight:700;}

  .timeline{display:flex; gap:0; align-items:stretch; margin-top:6px;}
  .timeline .t{flex:1; position:relative; padding:0 6px;}
  .timeline .t .yr{font-family:var(--mono); font-size:13px; font-weight:700; color:var(--violet);}
  .timeline .t .ev{font-size:13px; font-weight:700; margin-top:30px; line-height:1.3;}
  .timeline .t .ds{font-size:11.5px; color:var(--mut); margin-top:3px; line-height:1.35;}
  .timeline .t::before{content:""; position:absolute; left:0; right:0; top:26px; height:2px; background:var(--line);}
  .timeline .t::after{content:""; position:absolute; left:8px; top:21px; width:12px; height:12px; border-radius:50%; background:var(--violet); border:3px solid #fff; box-shadow:0 0 0 1px var(--violet-300);}

  .quote{background:var(--wash-2); border-left:4px solid var(--violet); border-radius:0 13px 13px 0; padding:18px 22px;}
  .quote p{margin:0; font-size:18px; line-height:1.5; font-weight:600; color:var(--ink);}
  .quote .src{margin-top:10px; font-size:12.5px; color:var(--mut); font-family:var(--mono);}
  .refbox{background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--violet); border-radius:4px; padding:14px 16px; display:flex; gap:12px; align-items:flex-start;}
  .refbox .rk{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; color:var(--violet); text-transform:uppercase; font-weight:700;}
  .refbox h4{margin:2px 0 3px; font-size:14.5px; font-weight:800;}
  .refbox p{margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.45;}
  .refbox .ri{flex:none;width:30px;height:30px;border-radius:8px;background:var(--violet);color:#fff;display:grid;place-items:center;}
  .refbox .ri svg{width:16px;height:16px;}

  .arch{display:flex; align-items:center; gap:18px; justify-content:center; margin:6px 0;}
  .arch .box{border:1.5px solid var(--line); border-radius:14px; padding:18px 20px; text-align:center; background:var(--wash-2); min-width:160px;}
  .arch .box .bt{font-size:15px; font-weight:800;} .arch .box .bs{font-size:12px; color:var(--mut); margin-top:3px; line-height:1.35;}
  .arch .box.local{border-style:dashed; border-color:var(--violet-300); background:#fff;}
  .arch .box.api{background:linear-gradient(135deg,#EFEAFF,#F8F5FF); border-color:var(--violet-300);}
  .arch .conn{display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--violet); font-family:var(--mono); font-size:11px; font-weight:700;}
  .arch .conn svg{width:34px;height:18px;}

  .stat-row{display:flex; gap:16px;}
  .stat{flex:1; background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--violet); border-radius:4px; padding:16px 18px;}
  .stat .num{font-size:30px; font-weight:800; letter-spacing:-.02em; color:var(--violet); font-family:var(--mono);}
  .stat .lab{font-size:13px; color:var(--ink-soft); margin-top:4px; line-height:1.4;}

  .twopane{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .pane{border:1px solid var(--line); border-radius:4px; padding:16px 18px; background:var(--paper);}
  .pane.bad{border-left:3px solid var(--rose);} .pane.good{border-left:3px solid var(--mint);}
  .pane h4{margin:0 0 9px; font-size:14px; font-weight:800; display:flex; align-items:center; gap:7px;}
  .pane.bad h4{color:#C9405B;} .pane.good h4{color:#0E9E6E;}
  .pane p{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .mini{font-family:var(--mono); font-size:13.5px; background:#16142B; border:1px solid #2A2545; border-radius:6px; padding:13px 15px; color:#E8E4F5; line-height:1.7; white-space:pre-wrap;}
  .pane .mini{font-family:var(--mono); font-size:12px; background:var(--wash-2); border:1px solid var(--line); border-radius:3px; padding:8px 10px; color:var(--ink-soft); line-height:1.5; margin-top:8px;}

  .controlbar{
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:70;
    display:flex; align-items:center; gap:4px;
    background:#2B2B2E; border-radius:999px; padding:8px 10px;
    box-shadow:0 16px 40px -12px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.04) inset;
  }
  .controlbar button{appearance:none; border:none; background:transparent; cursor:pointer; color:#C9C9D2; display:grid; place-items:center; border-radius:999px; transition:.12s ease; font-family:var(--serif);}
  .controlbar .ico{width:38px; height:38px;}
  .controlbar .ico svg{width:19px;height:19px;}
  .controlbar .ico:hover{color:#fff; background:rgba(255,255,255,.1);}
  .controlbar .ico:disabled{color:#5C5C66; cursor:not-allowed; background:transparent;}
  .controlbar .sep{width:1px; height:24px; background:rgba(255,255,255,.16); margin:0 6px;}
  .controlbar .count{ color:#EDEDF2; font-style:italic; font-family:Georgia,'Times New Roman',serif; font-size:17px; min-width:78px; text-align:center; letter-spacing:.02em; user-select:none;}
  .controlbar .count b{font-style:italic; font-weight:600;}
  .controlbar .zoom{width:32px;height:38px; color:#9A9AA6; font-size:18px;}
  .controlbar .zoom:hover{color:#fff;}
  .controlbar .zoom svg{width:17px;height:17px;}
  .controlbar .pdf{
    margin-left:6px; background:#7CB342; color:#fff; font-weight:800; font-size:14px; letter-spacing:.06em;
    padding:0 22px; height:38px; border-radius:999px; display:flex; align-items:center;
    box-shadow:0 6px 16px -6px rgba(124,179,66,.8);
  }
  .controlbar .pdf:hover{background:#86BD4B; color:#fff;}

  .overview{position:fixed; inset:0; z-index:80; background:rgba(22,20,43,.55); backdrop-filter:blur(8px); display:none; padding:40px; overflow:auto;}
  .overview.on{display:block;}
  .overview .head{display:flex; align-items:center; justify-content:space-between; max-width:1100px; margin:0 auto 18px; color:#fff;}
  .overview .head h3{margin:0; font-size:18px; font-weight:800;}
  .overview .head button{appearance:none;border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.1); color:#fff; border-radius:10px; padding:8px 14px; cursor:pointer; font-family:var(--serif); font-weight:700; font-size:13px;}
  .ovgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; max-width:1100px; margin:0 auto;}
  .ovcard{background:#fff; border:1px solid var(--line); border-radius:11px; padding:13px 15px; cursor:pointer; transition:.12s; text-align:left;}
  .ovcard:hover{transform:translateY(-2px); box-shadow:0 12px 22px -12px rgba(0,0,0,.4); border-color:var(--violet);}
  .ovcard .ovn{font-family:var(--mono); font-size:11px; color:var(--violet); font-weight:700;}
  .ovcard .ovt{font-size:13.5px; font-weight:700; margin-top:4px; line-height:1.3; color:var(--ink);}

  .hint{position:fixed; left:18px; bottom:24px; z-index:65; font-size:11px; color:var(--mut); font-family:var(--mono);}


  /* ===== 이미지 / 도해 컴포넌트 (덱 하네스 추가분) ===== */
  .figure{border:1px solid var(--line); border-radius:4px; background:var(--wash-2); overflow:hidden; display:flex; flex-direction:column; min-height:0;}
  .figure img{display:block; width:100%; height:auto; object-fit:contain; min-height:0;}
  .figure figcaption{font-family:var(--mono); font-size:11px; color:var(--mut); padding:7px 11px; border-top:1px solid var(--line); background:#fff;}
  .figure.tight img{max-height:330px; object-fit:contain; background:#fff;}
  /* 원본이 검은 여백을 달고 있는 캡처용 */
  .figure.dark{background:#16142B; border-color:#2A2548;}
  .figure.dark img{background:#16142B;}
  .figure.dark figcaption{background:#1C1933; color:#9C97D6; border-top-color:#2A2548;}

  /* 스크린샷: 창 프레임을 씌워 원본 캡처임을 드러낸다 */
  .shot{border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff; box-shadow:0 10px 26px -18px rgba(28,25,51,.6); display:flex; flex-direction:column; min-height:0;}
  .shot .sbar{display:flex; align-items:center; gap:6px; padding:7px 11px; background:var(--wash); border-bottom:1px solid var(--line);}
  .shot .sbar .d{width:9px;height:9px;border-radius:50%;background:var(--violet-300);}
  .shot .sbar .t{margin-left:6px; font-family:var(--mono); font-size:11px; color:var(--mut);}
  .shot img{display:block; width:100%; height:auto; max-height:400px; object-fit:contain; min-height:0;}

  /* 도구 두 가지를 나란히 처음 보여줄 때 — 그림과 한 줄만 */
  .duo{display:grid; grid-template-columns:1fr 1fr; gap:30px;}
  .duo .side{border:1px solid var(--line); border-radius:18px; background:var(--wash-2);
    padding:34px 30px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; text-align:center;}
  .duo .side img{max-height:92px; max-width:78%; width:auto; display:block;}
  .duo .side .tagline{font-family:var(--mono); font-size:11.5px; letter-spacing:.12em;
    color:var(--violet); text-transform:uppercase; font-weight:700;}
  .duo .side h3{margin:0; font-size:23px; font-weight:800; letter-spacing:-.02em;}
  .duo .side p{margin:0; font-size:15px; color:var(--ink-soft); line-height:1.55; max-width:30ch;}

  /* 제품·도구 로고 — 작은 브랜드 마크 */
  .brandmark{display:flex; align-items:center; gap:15px; margin-bottom:18px;}
  .brandmark img{height:46px; width:auto; display:block;}
  .brandmark .bt{font-size:13.5px; color:var(--ink-soft); line-height:1.45;}
  .brandmark .bt b{color:var(--ink);}

  /* 채워야 할 이미지 자리 — 인쇄에도 남으므로 발표 전 반드시 교체 */
  .need-img{border:2px dashed var(--violet-300); border-radius:4px; background:repeating-linear-gradient(135deg,#FBFAFF,#FBFAFF 10px,#F4F1FF 10px,#F4F1FF 20px);
    display:flex; flex-direction:column; justify-content:center; gap:6px; padding:20px 22px; min-height:150px;}
  .need-img .nk{font-family:var(--mono); font-size:10.5px; font-weight:700; letter-spacing:.1em; color:var(--violet); text-transform:uppercase;}
  .need-img .nd{font-size:14px; font-weight:700; color:var(--ink); line-height:1.4;}
  .need-img .nm2{font-family:var(--mono); font-size:11.5px; color:var(--mut);}
  .need-img.sm{min-height:92px; padding:14px 16px; align-items:center; text-align:center;}

  /* 코드 실행 결과 */
  .code .out{border-top:1px dashed #38325C; background:#141127; padding:11px 18px; font-family:var(--mono); font-size:12.5px; line-height:1.55; color:#9DE39A; white-space:pre; overflow:auto;}
  .code .out .ol{color:#7D78B8;}
  .code .err{color:#FF8E8E;}

  /* 메모리 슬롯 도해 */
  .slots{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-start;}
  .slot{border:1.5px solid var(--line); border-radius:8px; min-width:74px; padding:9px 11px; text-align:center; background:#fff;}
  .slot .adr{font-family:var(--mono); font-size:10px; color:var(--mut); letter-spacing:.02em;}
  .slot .val{font-family:var(--mono); font-size:15px; font-weight:700; color:var(--ink); margin-top:2px;}
  .slot .nm{font-size:11px; color:var(--violet); font-weight:700; margin-top:3px;}
  .slot.ref{border-style:dashed; border-color:var(--violet-300); background:var(--wash-2);}
  .slot.dim{opacity:.45;}
  .ptr{display:grid; place-items:center; color:var(--violet); font-family:var(--mono); font-size:18px; font-weight:700; padding:0 2px; align-self:center;}

  /* 인라인 SVG 차트 */
  .plot{background:var(--wash-2); border:1px solid var(--line); border-radius:4px; padding:14px; display:grid; place-items:center; min-height:0;}
  .plot svg{width:100%; height:auto; display:block; max-height:300px;}
  .plot .cap{font-family:var(--mono); font-size:11px; color:var(--mut); margin-top:8px; text-align:center;}
  .formula .cap{font-family:var(--mono); font-size:11.5px; color:var(--code-dim); text-align:center;}

  /* 수정·보강 표시 (원본 pptx에 없던 내용) */
  .newmark{position:absolute; top:30px; right:112px; font-family:var(--mono); font-size:10px; font-weight:700; letter-spacing:.08em;
    color:var(--mint); border:1px solid #BFE9E1; background:var(--mint-soft); border-radius:999px; padding:3px 9px;}

  @media print{
    @page{ size:1280px 720px; margin:0; }
    body{background:#fff !important;}
    .controlbar,.progress,.hint,.overview{display:none !important;}
    .stage{position:static; inset:auto; overflow:visible; display:block; padding:0;}
    .sizer{width:auto !important; height:auto !important;}
    .scaler{transform:none !important; width:auto !important; height:auto !important;}
    .slide{ display:flex !important; width:1280px !important; height:720px !important;
      border-radius:0 !important; border:none !important; box-shadow:none !important;
      page-break-after:always; break-after:page;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .slide:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>

<div class="progress"><div class="fill" id="pfill"></div></div>

<main class="stage" id="stage">
  <div class="sizer" id="sizer">
    <div class="scaler" id="scaler">



<!-- ============================================================
     슬라이드는 여기부터. 규격: 1280x720 고정.
     첫 장은 slide cover active, 나머지는 active 없이.
     ============================================================ -->

{{SLIDES}}

    </div>
  </div>
</main>
<div class="overview" id="overview">
  <div class="head"><h3>슬라이드 목차</h3><button id="ovClose">닫기 ✕</button></div>
  <div class="ovgrid" id="ovgrid"></div>
</div>

<div class="controlbar">
  <button class="ico" id="btnMenu" title="목차"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <span class="sep"></span>
  <button class="ico" id="btnPrev" title="이전"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
  <span class="count"><b id="cur">1</b> / <span id="tot2">75</span></span>
  <button class="ico" id="btnNext" title="다음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg></button>
  <span class="sep"></span>
  <button class="zoom" id="btnOut" title="축소"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14"/></svg></button>
  <button class="zoom" id="btnIn" title="확대"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="zoom" id="btnFit" title="화면 맞춤"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4"/></svg></button>
  <button class="pdf" id="btnPdf" title="PDF로 저장 (인쇄 → PDF로 저장)">PDF</button>
</div>

<div class="hint">← → 또는 Space · 목차(≡) · 줌(−/+) · 숫자 입력 후 Enter로 이동</div>
<div id="jumpHint"></div>
<style>
  #jumpHint{position:fixed; left:50%; bottom:74px; transform:translateX(-50%) translateY(6px); z-index:75;
    background:#2B2B2E; color:#fff; font-family:Georgia,'Times New Roman',serif; font-style:italic;
    font-size:20px; letter-spacing:.04em; padding:8px 20px; border-radius:999px;
    box-shadow:0 12px 28px -10px rgba(0,0,0,.55); opacity:0; pointer-events:none;
    transition:opacity .12s ease, transform .12s ease;}
  #jumpHint.on{opacity:1; transform:translateX(-50%) translateY(0);}
  @media print{ #jumpHint{display:none !important;} }
</style>

<script>
  const slides = Array.from(document.querySelectorAll('.slide'));
  const scaler = document.getElementById('scaler');
  const sizer  = document.getElementById('sizer');
  const stage  = document.getElementById('stage');
  const total  = slides.length;
  let idx = 0, userZoom = 1;
  const BW = 1280, BH = 720;

  document.getElementById('tot2').textContent = total;
  slides.forEach((s, i) => {
    const c = s.querySelector('.coord b');     if (c) c.textContent = String(i + 1).padStart(2, '0');
    const t = s.querySelector('.coord .tot');  if (t) t.textContent = total;
  });

  const ovgrid = document.getElementById('ovgrid');
  slides.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'ovcard';
    b.innerHTML = '<div class="ovn">' + String(i + 1).padStart(2, '0') + '</div><div class="ovt">' + (s.dataset.title || '') + '</div>';
    b.addEventListener('click', () => { go(i); closeOverview(); });
    ovgrid.appendChild(b);
  });
  const overview = document.getElementById('overview');
  function openOverview(){ overview.classList.add('on'); }
  function closeOverview(){ overview.classList.remove('on'); }
  document.getElementById('btnMenu').addEventListener('click', openOverview);
  document.getElementById('ovClose').addEventListener('click', closeOverview);
  overview.addEventListener('click', (e) => { if (e.target === overview) closeOverview(); });

  function fitScale(){
    const availW = stage.clientWidth  - 60;
    const availH = stage.clientHeight - 60;
    return Math.min(availW / BW, availH / BH);
  }
  function applyScale(){
    const eff = fitScale() * userZoom;
    scaler.style.transform = 'scale(' + eff + ')';
    sizer.style.width  = (BW * eff) + 'px';
    sizer.style.height = (BH * eff) + 'px';
  }
  window.addEventListener('resize', applyScale);

  function go(n){
    idx = Math.max(0, Math.min(total - 1, n));
    slides.forEach((s, i) => s.classList.toggle('active', i === idx));
    document.getElementById('cur').textContent = idx + 1;
    document.getElementById('btnPrev').disabled = idx === 0;
    document.getElementById('btnNext').disabled = idx === total - 1;
    document.getElementById('pfill').style.width = (idx / (total - 1) * 100) + '%';
    applyScale();
    stage.scrollTop = 0; stage.scrollLeft = 0;
  }
  document.getElementById('btnPrev').addEventListener('click', () => go(idx - 1));
  document.getElementById('btnNext').addEventListener('click', () => go(idx + 1));
  document.getElementById('btnIn').addEventListener('click',  () => { userZoom = Math.min(2.4, userZoom + 0.15); applyScale(); });
  document.getElementById('btnOut').addEventListener('click', () => { userZoom = Math.max(0.5, userZoom - 0.15); applyScale(); });
  document.getElementById('btnFit').addEventListener('click', () => { userZoom = 1; applyScale(); });
  document.getElementById('btnPdf').addEventListener('click', () => window.print());

  // ---- 슬라이드 번호 입력 → Enter 로 점프 ----
  let jumpBuf = '', jumpTimer = null;
  const jumpHint = document.getElementById('jumpHint');
  function showJump(){
    if (!jumpHint) return;
    if (jumpBuf){ jumpHint.textContent = '→ ' + jumpBuf; jumpHint.classList.add('on'); }
    else { jumpHint.classList.remove('on'); }
  }
  function clearJump(){ jumpBuf = ''; if (jumpTimer) clearTimeout(jumpTimer); showJump(); }
  function commitJump(){
    if (jumpBuf){ const n = parseInt(jumpBuf, 10); if (!isNaN(n)) go(n - 1); }
    clearJump();
  }

  document.addEventListener('keydown', (e) => {
    if (overview.classList.contains('on')) { if (e.key === 'Escape') closeOverview(); return; }
    if (/^[0-9]$/.test(e.key)){
      e.preventDefault();
      jumpBuf = (jumpBuf + e.key).slice(0, 3);
      showJump();
      if (jumpTimer) clearTimeout(jumpTimer);
      jumpTimer = setTimeout(clearJump, 1600);
      return;
    }
    if (e.key === 'Enter'){ e.preventDefault(); commitJump(); return; }
    if (e.key === 'Escape'){ clearJump(); }
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ e.preventDefault(); clearJump(); go(idx + 1); }
    if (e.key === 'ArrowLeft'  || e.key === 'PageUp'){ e.preventDefault(); clearJump(); go(idx - 1); }
    if (e.key === 'Home'){ clearJump(); go(0); } if (e.key === 'End'){ clearJump(); go(total - 1); }
    if (e.key === '+' || e.key === '='){ userZoom = Math.min(2.4, userZoom + 0.15); applyScale(); }
    if (e.key === '-'){ userZoom = Math.max(0.5, userZoom - 0.15); applyScale(); }
  });

  applyScale(); go(0);
</script>
<script>
// 코드 블록마다 「복사」 버튼
document.querySelectorAll('.code').forEach(function (box) {
  var bar = box.querySelector('.bar'), code = box.querySelector('pre');
  if (!bar || !code) return;
  var b = document.createElement('button');
  b.className = 'copybtn'; b.type = 'button'; b.textContent = '복사';
  b.addEventListener('click', function (ev) {
    ev.stopPropagation();
    var text = code.innerText.replace(/\n$/, '');
    var ok = function () { b.textContent = '복사됨'; b.classList.add('done'); setTimeout(function () { b.textContent = '복사'; b.classList.remove('done'); }, 1500); };
    if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(ok); }
    else { var ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} ta.remove(); }
  });
  bar.appendChild(b);
  if (box.dataset.file) {                       // 템플릿은 파일로 바로 저장
    var sv = document.createElement('button');
    sv.className = 'savebtn'; sv.type = 'button'; sv.textContent = '파일로 저장';
    sv.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var blob = new Blob([code.innerText.replace(/\n$/, '') + '\n'], {type: 'text/plain;charset=utf-8'});
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = box.dataset.file;
      document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    });
    bar.appendChild(sv);
  }
});
</script>

</body>
</html>
